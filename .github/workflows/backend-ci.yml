name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual="$(go env GOVERSION | sed 's/^go//')"
          test "$actual" = "$expected"
      - name: Gemini thinking effort regression
        working-directory: backend
        run: go test -tags=unit ./internal/service -run '^TestGeminiThinkingEffortLaffey_' -count=1
      - name: Check Gemini thinking formatting
        working-directory: backend
        run: |
          files="$(gofmt -l internal/service/gemini_thinking_effort_laffey_test.go internal/service/gemini_compat_thinking.go internal/service/gemini_compat_thinking_test.go internal/service/gemini_reasoning_effort.go internal/service/gemini_native_reasoning_pricing_test.go internal/service/gemini_chat_completions_compat_service.go)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Gemini compatibility race tests
        working-directory: backend
        run: go test -race -tags=unit ./internal/service ./internal/handler -run 'TestGemini.*Laffey' -count=1
      - name: Laffey synchronization contracts
        run: python -m unittest discover -s .laffey/testsuite -v
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual="$(go env GOVERSION | sed 's/^go//')"
          test "$actual" = "$expected"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
