name: Release

on:
  push:
    tags:
      - "v*.*.*-laffey.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Laffey tag to create or reuse, for example v0.1.149-laffey.1"
        required: true
        type: string
      simple_release:
        description: "Build only the linux/amd64 GHCR image and skip binary archives"
        required: false
        type: boolean
        default: false

env:
  SIMPLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simple_release == 'true' }}

permissions:
  contents: write
  packages: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate lock and create or reuse tag
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-laffey\.[1-9][0-9]*$ ]]; then
            echo "Invalid Laffey release tag: $TAG_NAME" >&2
            exit 1
          fi

          LOCKED_TAG="$(python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('.laffey/upstream.lock.json').read_text(encoding='utf-8'))
          if lock.get('status') == 'bootstrap':
              raise SystemExit('The first upstream snapshot must be merged before releasing')
          print(lock['upstream']['tag'])
          PY
          )"
          EXPECTED_PREFIX="${LOCKED_TAG}-laffey."
          if [[ "$TAG_NAME" != "$EXPECTED_PREFIX"* ]]; then
            echo "Tag $TAG_NAME does not match locked upstream release $LOCKED_TAG" >&2
            exit 1
          fi

          git fetch origin "${{ github.event.repository.default_branch }}"
          MASTER_SHA="$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
          if git rev-parse --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
            if [[ "$TAG_SHA" != "$MASTER_SHA" ]]; then
              VERSION="${TAG_NAME#v}"
              MASTER_PARENT="$(git rev-parse "$MASTER_SHA^")"
              MASTER_MESSAGE="$(git log -1 --format=%s "$MASTER_SHA")"
              MASTER_VERSION="$(git show "$MASTER_SHA:backend/cmd/server/VERSION" | tr -d '\r\n')"
              CHANGED_PATHS="$(git diff-tree --no-commit-id --name-only -r "$MASTER_SHA")"
              EXPECTED_MESSAGE="chore: sync VERSION to $VERSION [skip ci]"

              if [[ "$MASTER_PARENT" != "$TAG_SHA" ||
                    "$MASTER_MESSAGE" != "$EXPECTED_MESSAGE" ||
                    "$MASTER_VERSION" != "$VERSION" ||
                    "$CHANGED_PATHS" != "backend/cmd/server/VERSION" ]]; then
                echo "Existing tag $TAG_NAME is not current master or its verified VERSION sync parent" >&2
                exit 1
              fi
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" "$MASTER_SHA" -m "Laffey release $TAG_NAME based on $LOCKED_TAG"
            git push origin "refs/tags/$TAG_NAME"
          else
            echo "Push event tag $TAG_NAME was not fetched" >&2
            exit 1
          fi

  update-version:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Update VERSION file
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [update-version, build-frontend]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != 'skip' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: git fetch --tags --force

      - name: Get tag message
        id: tag_message
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Processing tag: $TAG_NAME"

          TAG_MESSAGE="$(git tag -l --format='%(contents:body)' "$TAG_NAME")"
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="$(git log -1 --pretty=%B)"
          fi

          {
            echo "message<<EOF"
            echo "$TAG_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            release --clean --skip=validate
            ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}

      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != 'skip' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/sub2api_laffey
          short-description: "Laffey API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api_laffey"

          SAFE_TAG_MESSAGE="$(printf '%s' "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')"
          if [ ${#SAFE_TAG_MESSAGE} -gt 3500 ]; then
            SAFE_TAG_MESSAGE="${SAFE_TAG_MESSAGE:0:3500}..."
          fi

          MESSAGE="Laffey API new release: ${VERSION}"$'\n\n'
          if [ -n "$SAFE_TAG_MESSAGE" ]; then
            MESSAGE+="${SAFE_TAG_MESSAGE}"$'\n\n'
          fi

          MESSAGE+="Docker deployment:"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          if [ "$DOCKERHUB_USERNAME" != "skip" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api_laffey"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n\n'
          MESSAGE+="GitHub Release: https://github.com/${REPO}/releases/tag/${TAG_NAME}"$'\n'
          MESSAGE+="GitHub Packages: https://github.com/${REPO}/pkgs/container/sub2api_laffey"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          CURRENT_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION || true)"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
